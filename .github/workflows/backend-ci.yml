name: Backend CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.14
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show Python runtime
        run: |
          python --version
          python -m pip --version

      - name: Install committed requirements
        run: python -m pip install --requirement requirements.txt

      - name: Check installed requirements
        run: python -m pip check

      - name: Compile backend modules
        run: >-
          python -m compileall app.py app_auth.py chat_guide_prompt.py db.py
          mailer.py models.py

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

      - name: Run focused unit tests
        run: python -m unittest discover -s tests

      - name: Run pre-commit hooks
        run: pre-commit run --all-files
