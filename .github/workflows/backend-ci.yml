name: Backend CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_restart:
        description: Restart cloudchat.service after deploying the exact commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.14
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show Python runtime
        run: |
          python --version
          python -m pip --version

      - name: Install committed requirements
        run: python -m pip install --requirement requirements.txt

      - name: Check installed requirements
        run: python -m pip check

      - name: Compile backend modules
        run: >-
          python -m compileall app.py app_auth.py chat_guide_prompt.py db.py
          mailer.py models.py security_policy.py

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

      - name: Check deployment script syntax
        run: bash -n scripts/deploy_production.sh

      - name: Validate canonical service unit contract
        run: python -m unittest tests.test_service_unit

      - name: Run focused unit tests
        run: python -m unittest discover -s tests

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  deploy:
    name: Deploy exact commit to production
    needs: quality
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: backend-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      TARGET_SHA: ${{ github.sha }}
      FORCE_RESTART: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        inputs.force_restart == true && 'true' || 'false' }}

    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *..* ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FORCE_RESTART" == "true" || "$FORCE_RESTART" == "false" ]]
          test -n "$SSH_PRIVATE_KEY"

      - name: Prepare deployment SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/cloudchat_deploy_key"
          ssh-keyscan -H -T 15 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cloudchat_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Synchronize exact commit and verify health
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/cloudchat_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$TARGET_SHA" "$FORCE_RESTART" \
            < scripts/deploy_production.sh

      - name: Remove deployment SSH identity
        if: always()
        run: |
          rm -f "$HOME/.ssh/cloudchat_deploy_key" "$HOME/.ssh/known_hosts"
